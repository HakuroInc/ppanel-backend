name: Deploy production

# Every push to the production branch is checked, built for the production
# host (linux/arm64) and rolled out there. The host side lives in /opt/ppanel
# (compose.yaml, .env, deploy.sh); see docs/deploy-production.md.
on:
  push:
    branches: [production]
  workflow_dispatch:

permissions:
  contents: read

# One rollout at a time, in push order; a newer push waits rather than
# cancelling a deploy halfway.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # Same gate as ci.yml and nightly.yml: nothing reaches the host unless it
  # passes.
  verify:
    uses: ./.github/workflows/checks.yml

  build:
    name: Build arm64 image
    needs: verify
    # Native arm64 runner: the host is aarch64, and QEMU would take far longer.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Registry paths must be lowercase; the owner (AS207299) is not.
      - name: Resolve build metadata
        id: meta
        run: |
          owner="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${owner}/ppanel-backend" >> "$GITHUB_OUTPUT"
          echo "BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          echo "VERSION=production-${GITHUB_SHA::8}" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push the production image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          push: true
          cache-from: type=gha,scope=production
          cache-to: type=gha,mode=max,scope=production
          build-args: |
            VERSION=${{ env.VERSION }}
            CHANNEL=production
            BUILD_TIME=${{ env.BUILD_TIME }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
            ${{ steps.meta.outputs.image }}:production

  deploy:
    name: Roll out to the production host
    needs: build
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      # The deploy key is pinned to /opt/ppanel/deploy.sh by a forced command
      # on the host, so all it can do is deploy: the commit sha travels as the
      # SSH command and this job's short-lived registry token on stdin.
      - name: Deploy ${{ github.sha }}
        env:
          SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' "$GHCR_TOKEN" | ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=15 "$SSH_HOST" "$GITHUB_SHA"
