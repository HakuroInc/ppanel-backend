name: Deploy production

# Every push to the production branch is cross-compiled for the production
# host (linux/arm64) on the organization's self-hosted runner and shipped
# there over SSH; see docs/deploy-production.md. No tests run here on purpose.
on:
  push:
    branches: [production]
  workflow_dispatch:

permissions:
  contents: read

# One rollout at a time, in push order.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and roll out
    if: github.ref == 'refs/heads/production'
    runs-on: [self-hosted, Linux, X64]
    environment: production
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Same flags as the repository Dockerfile; the host wraps the binary
      # into the image (deploy/production/Dockerfile.runtime).
      - name: Build linux/arm64 binary
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: arm64
        run: |
          LDFLAGS="$(VERSION="production-${GITHUB_SHA::8}" CHANNEL=stable \
            BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)" sh script/ldflags.sh)"
          go build -trimpath -ldflags="$LDFLAGS" -o "$RUNNER_TEMP/ppanel" main.go

      # The deploy key is pinned to /opt/ppanel/deploy.sh by a forced command
      # on the host: the commit sha travels as the SSH command, the binary on
      # stdin.
      - name: Deploy ${{ github.sha }}
        env:
          SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          key="$RUNNER_TEMP/deploy_key"
          hosts="$RUNNER_TEMP/known_hosts"
          trap 'rm -f "$key" "$hosts"' EXIT
          (umask 077; printf '%s\n' "$SSH_KEY" > "$key")
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$hosts"
          ssh -F /dev/null -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$hosts" \
            -o ServerAliveInterval=15 "$SSH_HOST" "$GITHUB_SHA" < "$RUNNER_TEMP/ppanel"
          rm -f "$RUNNER_TEMP/ppanel"
